name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  artifacts:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - name: Cross-compile reproducible native clients
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0
            name=thothmemory-${GOOS}-${GOARCH}
            if [ "$GOOS" = windows ]; then name=$name.exe; fi
            go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o dist/$name ./cmd/thothmemory
          done
          cd dist
          sha256sum thothmemory-* > SHA256SUMS
      - name: Create draft release awaiting image validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "ThothMemory $GITHUB_REF_NAME" --notes-file CHANGELOG.md
