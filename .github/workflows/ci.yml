name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 30
      mariadb:
        image: mariadb:11.4.12@sha256:4f1d8d202fcf7bcb3902f63af09f9c1a050c2922a89652f22abaec0d4f015e83
        env:
          MARIADB_ROOT_PASSWORD: ci-disposable-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 3s
          --health-timeout 3s --health-retries 40
    env:
      THOTH_TEST_DATABASE_URL: postgres://postgres:ci-disposable-password@localhost:5432/postgres?sslmode=disable
      THOTH_TEST_MARIADB_ADDR: 127.0.0.1:3306
      THOTH_TEST_MARIADB_ROOT_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - run: ./scripts/check.sh
      - name: Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Validate Compose and image
        env:
          THOTH_IMAGE: thoth-memory:ci
        run: |
          go build -o bin/thothmemory ./cmd/thothmemory
          ./bin/thothmemory init-config
          docker compose config --quiet
          docker build -t thoth-memory:ci .
      - name: Container vulnerability analysis
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: thoth-memory:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Clean deployment, persistence, backup and restore
        env:
          THOTH_IMAGE: thoth-memory:ci
        run: ./scripts/acceptance.sh
      - name: Enable arm64 emulation for actual candidate validation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Verify executable architectures and exercise both candidate servers
        env:
          IMAGE: thoth-memory:ci-platform
          SMOKE_LOCAL_IMAGES: '1'
        run: |
          docker tag thoth-memory:ci "$IMAGE-amd64"
          docker build --platform linux/arm64 -t "$IMAGE-arm64" .
          ./scripts/smoke-platforms.sh
      - if: always()
        run: docker compose logs --no-color
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - run: go test ./internal/cli ./internal/store
      - run: go build -o bin/thothmemory.exe ./cmd/thothmemory
      - name: Windows bootstrap syntax and secure idempotent configuration
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          ./bin/thothmemory.exe init-config
          $before = Get-FileHash .secrets/agent_token
          ./bin/thothmemory.exe init-config
          if ((Get-FileHash .secrets/agent_token).Hash -ne $before.Hash) { throw 'Credentials rotated unexpectedly' }
      - name: Windows existing image selection regression
        shell: pwsh
        run: ./tests/windows-image-selection.ps1 -SetupPath (Join-Path $PWD 'setup.ps1')
  mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build Mini images and verify executable architectures
        run: |
          set -eu
          for variant in "" "-glibc"; do
            for arch in amd64 arm64; do
              tag=thoth-memory-mini:ci$variant-$arch
              docker build --platform linux/$arch -f Dockerfile.mini$variant -t $tag .
              c=$(docker create --platform linux/$arch $tag)
              for f in /usr/local/bin/thothmemory-mini $(docker run --rm --platform linux/$arch --entrypoint sh $tag -c 'command -v mariadbd'); do
                docker cp "$c:$f" bin.elf
                want=62; [ $arch = arm64 ] && want=183
                got=$(python3 -c "import struct;print(struct.unpack('<H',open('bin.elf','rb').read(20)[18:20])[0])")
                echo "$tag $f machine=$got"; test "$got" = "$want"
              done
              docker rm "$c" >/dev/null
            done
          done
      - name: Mini glibc vulnerability analysis
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: thoth-memory-mini:ci-glibc-amd64
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Acceptance and lifecycle gates (amd64)
        run: |
          set -eu
          docker run -d --name ci-mini -p 127.0.0.1:7319:7319 -e THOTH_LISTEN=0.0.0.0:7319 -v ci-mini:/data thoth-memory-mini:ci-amd64
          for i in $(seq 120); do curl -sf http://127.0.0.1:7319/healthz && break; sleep 1; done
          umask 077
          docker exec ci-mini thothmemory-mini token local-agent > agent_token
          docker exec ci-mini thothmemory-mini token local-reader > read_token
          python3 scripts/mini-acceptance.py --endpoint http://127.0.0.1:7319/mcp --token-file agent_token --reader-token-file read_token
          docker rm -f ci-mini
          THOTH_LIFECYCLE_MCP=1 THOTH_SKEW_GATE=1 scripts/mini-lifecycle.sh ci-mini-lifecycle ci-mini thoth-memory-mini:ci-amd64 7319
          # The script leaves its fixture running; its mariadbd would be counted as an orphan by the next run.
          docker rm -f -v ci-mini-lifecycle
      - name: TCP-loopback fallback mode (runtimes that cannot use the socket)
        run: |
          set -eu
          docker run -d --name ci-tcp -e THOTH_DB_TCP=127.0.0.1:33306 -e THOTH_LISTEN=127.0.0.1:7319 thoth-memory-mini:ci-amd64
          for i in $(seq 120); do docker exec ci-tcp thothmemory-mini healthcheck && break; sleep 1; done
          docker exec ci-tcp thothmemory-mini healthcheck
          # The TCP fallback keeps TLS and certificate verification; its backup must also work.
          docker exec ci-tcp sh -c 'thothmemory-mini backup > /tmp/tcp.sql 2> /tmp/tcp.err; grep -q "^sha256=" /tmp/tcp.err && test -s /tmp/tcp.sql'
          docker rm -f ci-tcp
      - name: Emulated arm64 gates (glibc image; musl mariadbd does not bootstrap under QEMU)
        run: |
          set -eu
          docker run -d --platform linux/arm64 --name ci-arm -p 127.0.0.1:7320:7319 -e THOTH_LISTEN=0.0.0.0:7319 thoth-memory-mini:ci-glibc-arm64
          for i in $(seq 600); do curl -sf http://127.0.0.1:7320/healthz && break; sleep 1; done
          umask 077
          docker exec ci-arm thothmemory-mini token local-agent > arm_token
          docker exec ci-arm thothmemory-mini token local-reader > arm_read_token
          python3 scripts/mini-acceptance.py --endpoint http://127.0.0.1:7320/mcp --token-file arm_token --reader-token-file arm_read_token
          docker rm -f -v ci-arm
      - name: Emulated arm64 backup, restore and recovery lifecycle (glibc image)
        run: PLATFORM=linux/arm64 THOTH_LIFECYCLE_MCP=1 THOTH_SKEW_GATE=1 scripts/mini-lifecycle.sh ci-arm-lifecycle ci-arm-data thoth-memory-mini:ci-glibc-arm64 7320
  compose-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - name: Build the candidate Full image
        run: docker build -t thoth-memory:isolation-test .
      - name: Compose collision, upgrade chain, backup/restore (disposable Docker-in-Docker daemon)
        run: THOTH_NEW_IMAGE=thoth-memory:isolation-test scripts/compose-isolation-dind.sh
  ultralite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - name: Build without CGO and check the headless boundary
        shell: bash
        run: |
          set -eu
          exe=ul; [ "$RUNNER_OS" = Windows ] && exe=ul.exe
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o $exe ./cmd/thothmemory-ultralite
          ! go list -deps ./cmd/thothmemory-ultralite | grep -E 'internal/(gateway|web|store|mariadb|mini)$'
      - name: Native init, repeat init and doctor
        shell: bash
        run: |
          exe=./ul; [ "$RUNNER_OS" = Windows ] && exe=./ul.exe
          $exe --data "$RUNNER_TEMP/ultralite home" init
          $exe --data "$RUNNER_TEMP/ultralite home" init
          $exe --data "$RUNNER_TEMP/ultralite home" doctor
      - name: SQLite contract, process, crash and native CLI tests
        shell: bash
        run: |
          race=-race
          # The race detector needs a C toolchain on Windows runners.
          [ "$RUNNER_OS" = Windows ] && race=
          go test $race -count=1 -run 'TestContractSQLite|TestSQLite|TestUltraLite' ./tests
      - name: Install pinned Codex CLI for real beginner registration
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/quickstart-client" @openai/codex@0.162.1
          echo "$RUNNER_TEMP/quickstart-client/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Native beginner install, real client registration and persistent write
        shell: bash
        run: |
          exe=./ul; [ "$RUNNER_OS" = Windows ] && exe=./ul.exe
          python scripts/quickstart-smoke.py "$exe" --client codex
      - name: Native UltraLite acceptance (permissions, no listener, concurrency, backup, restore)
        if: runner.os != 'Windows'
        run: python3 scripts/ultralite-acceptance.py ./ul
