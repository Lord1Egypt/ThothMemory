name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s
          --health-timeout 3s --health-retries 30
    env:
      THOTH_TEST_DATABASE_URL: postgres://postgres:ci-disposable-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - run: ./scripts/check.sh
      - name: Go vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Validate Compose and image
        env:
          THOTH_IMAGE: thoth-memory:ci
        run: |
          go build -o bin/thothmemory ./cmd/thothmemory
          ./bin/thothmemory init-config
          docker compose config --quiet
          docker build -t thoth-memory:ci .
      - name: Container vulnerability analysis
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: thoth-memory:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Clean deployment, persistence, backup and restore
        env:
          THOTH_IMAGE: thoth-memory:ci
        run: ./scripts/acceptance.sh
      - name: Enable arm64 emulation for actual candidate validation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Verify executable architectures and exercise both candidate servers
        env:
          IMAGE: thoth-memory:ci-platform
          SMOKE_LOCAL_IMAGES: '1'
        run: |
          docker tag thoth-memory:ci "$IMAGE-amd64"
          docker build --platform linux/arm64 -t "$IMAGE-arm64" .
          ./scripts/smoke-platforms.sh
      - if: always()
        run: docker compose logs --no-color
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
      - run: go test ./internal/cli ./internal/store
      - run: go build -o bin/thothmemory.exe ./cmd/thothmemory
      - name: Windows bootstrap syntax and secure idempotent configuration
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          ./bin/thothmemory.exe init-config
          $before = Get-FileHash .secrets/agent_token
          ./bin/thothmemory.exe init-config
          if ((Get-FileHash .secrets/agent_token).Hash -ne $before.Hash) { throw 'Credentials rotated unexpectedly' }
