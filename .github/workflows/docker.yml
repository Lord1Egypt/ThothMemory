name: Docker publication
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag with a successful Release validation run
        required: true
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    concurrency:
      group: thothmemory-docker-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Validate version tag at checked commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(git describe --tags --exact-match)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse HEAD)
          passed=$(gh run list --workflow release.yml --commit "$sha" --status success --json databaseId --jq length)
          test "$passed" -gt 0
          # A published semantic version is immutable, including on manual retries.
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Enable multi-platform image storage on the runner
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build versioned OCI image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory:candidate-${{ steps.version.outputs.sha }}
          sbom: true
          provenance: mode=max
      - name: Extract the candidate's validation client
        env:
          THOTH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory@${{ steps.image.outputs.digest }}
        run: |
          docker pull "$THOTH_IMAGE"
          id=$(docker create "$THOTH_IMAGE")
          mkdir -p bin
          docker cp "$id:/usr/local/bin/thothmemory" bin/thothmemory
          docker rm "$id"
          chmod +x bin/thothmemory
      - name: Build separate glibc Mini candidate (gzip layers for ThothDock)
        id: mini
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.mini-glibc
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory-mini:candidate-${{ steps.version.outputs.sha }},push=true,compression=gzip,force-compression=true
          sbom: true
          provenance: mode=max
      - name: Scan the exact Mini candidate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory-mini@${{ steps.mini.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Mini architectures, MCP, persistence, crash recovery and backup/restore
        env:
          MINI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory-mini@${{ steps.mini.outputs.digest }}
        run: bash scripts/smoke-mini-platforms.sh
      - name: Smoke-test both architectures using the published digest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory@${{ steps.image.outputs.digest }}
        run: ./scripts/smoke-platforms.sh
      - name: Clean deployment from the published image
        env:
          THOTH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory@${{ steps.image.outputs.digest }}
        run: |
          ./scripts/acceptance.sh
      - name: Verify complete downloads, publish versioned images, then publish release
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory
          DIGEST: ${{ steps.image.outputs.digest }}
          MINI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/thoth-memory-mini
          MINI_DIGEST: ${{ steps.mini.outputs.digest }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          # Refuse existing immutable version tags unless they already resolve
          # to this exact candidate (safe resumption of a partial publication).
          for spec in "$IMAGE:${TAG#v}|$DIGEST" "$MINI_IMAGE:0.1.0|$MINI_DIGEST"; do
            ref=${spec%|*}; expected=${spec#*|}
            if existing=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              test "$existing" = "$expected"
            fi
          done
          mkdir -p downloads metadata
          gh release download "$TAG" --dir downloads
          (cd downloads && sha256sum -c SHA256SUMS)
          for name in thothmemory-ultralite-windows-amd64.exe thothmemory-ultralite-linux-amd64 thothmemory-ultralite-linux-arm64 thothmemory-linux-amd64 thothmemory-linux-arm64 thothmemory-windows-amd64.exe thothmemory-windows-arm64.exe "thothmemory-$TAG-source.tar.gz" thothmini.sh PLATFORMS.md RELEASE_NOTES.md; do
            test -s "downloads/$name"
          done
          printf '%s\n' "$IMAGE@$DIGEST" > IMAGE_DIGEST.txt
          printf '%s\n' "$MINI_IMAGE@$MINI_DIGEST" > MINI_IMAGE_DIGEST.txt
          for name in IMAGE_DIGEST.txt MINI_IMAGE_DIGEST.txt; do
            if test -f "downloads/$name"; then cmp "$name" "downloads/$name"; else gh release upload "$TAG" "$name"; fi
          done
          docker buildx imagetools create -t "$IMAGE:${TAG#v}" "$IMAGE@$DIGEST"
          docker buildx imagetools create -t "$MINI_IMAGE:0.1.0" "$MINI_IMAGE@$MINI_DIGEST"
          # Mini intentionally has no Full-repository tag or latest promotion.
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          gh release edit "$TAG" --draft=false --latest
